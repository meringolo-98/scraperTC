# Generic plant-TC talk. Noisy (orchids, bananas). Only with --broad; Gate 2 demotes hobby.
tc_companies:
  - "tissue culture lab"
  - "plant tissue culture"
  - micropropagation
  - "meristem culture"
  - "temporary immersion bioreactor"

mammalian:
  - "mammalian cell culture"
  - organoid
  - "iPSC"

scholarly:
  - '(cannabis OR hemp OR "Cannabis sativa") AND (tissue culture OR micropropagation OR meristem OR "hop latent" OR viroid)'
  - '(cannabis OR hemp OR "Cannabis sativa") AND ("genomic selection" OR "genomic prediction" OR GWAS OR "marker-assisted")'
  - '(cannabis OR hemp) AND (CRISPR OR phenotyping OR "whole genome")'

arxiv:
  - 'all:"cannabis" AND (all:"tissue culture" OR all:meristem OR all:"genomic selection")'
  - 'all:"Cannabis sativa" AND (all:micropropagation OR all:GWAS)'

