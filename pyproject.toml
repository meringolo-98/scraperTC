[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapertc"
version = "0.1.0"
description = "Two-gate tissue culture chatter pickup: collect everywhere, then score competition, breakthroughs, and saturation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Matt Meringolo" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "feedparser>=6.0",
  "python-dotenv>=1.0",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-httpx>=0.32",
  "ruff>=0.6",
]

[project.scripts]
scrapertc = "scrapertc.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/scrapertc/cli.py" = ["B008"]
"src/scrapertc/gate2/report.py" = ["E501"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scrapertc = ["assets/*.json"]
